[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackure"
version = "0.0.0"
description = "Stackure for Python: passwordless auth for B2B apps as ASGI and WSGI middleware. Zero dependencies."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Stackure", email = "contact@mappstack.com" }]
keywords = ["stackure", "authentication", "auth", "passwordless", "magic-link", "b2b", "rbac", "mcp", "middleware", "asgi", "wsgi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://stackure.com"
Repository = "https://github.com/syi-stackure/sdk-py"
Documentation = "https://stackure.com/docs/python"
"Bug Tracker" = "https://github.com/syi-stackure/sdk-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["stackure"]

[tool.hatch.build.targets.wheel.force-include]
"stackure/py.typed" = "stackure/py.typed"

[tool.hatch.build.targets.sdist]
exclude = ["/CLAUDE.md"]
